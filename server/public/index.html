<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhereAmI • Live Location</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    #map { width: 100%; height: 100%; z-index: 1; }
    
    .top-card {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 500px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 18px;
      color: #fff;
      z-index: 1000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 12px;
    }
    .header-left {
      flex: 1;
      min-width: 0;
    }
    .session-title {
      font-weight: 700;
      font-size: 16px;
      color: #38bdf8;
      letter-spacing: 0.01em;
      line-height: 1.3;
      word-break: break-word;
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }
    .status-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(34, 197, 94, 0.18); color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.45);
      padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
    }
    .pulse-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.9);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); box-shadow: 0 0 4px rgba(74, 222, 128, 0.6); }
      50% { opacity: 0.5; transform: scale(1.3); box-shadow: 0 0 12px rgba(74, 222, 128, 1); }
      100% { opacity: 1; transform: scale(1); box-shadow: 0 0 4px rgba(74, 222, 128, 0.6); }
    }
    
    .countdown-chip {
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 500;
      white-space: nowrap;
    }
    
    .place-name { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .activity-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      padding: 3px 9px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .trekking-badge { font-size: 13px; color: #38bdf8; font-weight: 600; margin-bottom: 8px; }
    
    .status-alert {

      display: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .alert-paused { display: block; background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .alert-ended { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .stats-row { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; font-size: 13px; color: #94a3b8; flex-wrap: wrap; gap: 6px; }
    .stat-item b { color: #f8fafc; }

    .actions-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gmaps-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .gmaps-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #fff;
    }
    .card-toggle-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .card-toggle-btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: #38bdf8;
      color: #fff;
    }
    .card-toggle-btn .toggle-icon {
      transition: transform 0.25s ease;
    }
    .top-card.collapsed .card-toggle-btn .toggle-icon {
      transform: rotate(180deg);
    }
    .top-card.collapsed {
      padding: 10px 14px;
    }
    .top-card.collapsed .header-row {
      margin-bottom: 0;
    }
    .top-card.collapsed .status-alert,
    .top-card.collapsed .stats-row,
    .top-card.collapsed .actions-row,
    .top-card.collapsed .guest-sharing-row,
    .top-card.collapsed #trekkingBadge,
    .top-card.collapsed #activityBadge {
      display: none !important;
    }

    .guest-sharing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: #94a3b8;
    }
    .guest-name-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 2px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      user-select: none;
    }
    .guest-name-pill:hover {
      background: rgba(16, 185, 129, 0.28);
      color: #fff;
    }

    .top-card.collapsed .place-name {
      font-size: 15px;
      margin-bottom: 0;
      margin-top: 4px;
    }
    
    .map-controls-group {
      position: absolute;
      bottom: 24px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }
    .map-ctrl-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #38bdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      padding: 0;
    }
    .map-ctrl-btn:hover {
      transform: scale(1.05);
      background: rgba(30, 41, 59, 0.98);
      border-color: #38bdf8;
      color: #fff;
    }
    .map-ctrl-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.6);
    }
    .map-ctrl-btn.visitor {
      color: #10b981;
    }
    .map-ctrl-btn.visitor:hover {
      border-color: #10b981;
      color: #34d399;
    }
    .map-ctrl-btn.visitor.active {
      background: #059669;
      color: #fff;
      border-color: #34d399;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
    }
    .compass-rose {
      width: 22px;
      height: 22px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
    }
    .needle-north {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 3.5px solid transparent;
      border-right: 3.5px solid transparent;
      border-bottom: 10px solid #ef4444;
    }
    .needle-south {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 3.5px solid transparent;
      border-right: 3.5px solid transparent;
      border-top: 10px solid #94a3b8;
    }
    .compass-pivot {
      position: absolute;
      width: 3.5px;
      height: 3.5px;
      background: #ffffff;
      border-radius: 50%;
    }
    .compass-heading-text {
      font-size: 7px;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 1px;
      line-height: 1;
      text-align: center;
    }

    .live-host-icon-container,
    .live-visitor-icon-container {
      background: transparent;
      border: none;
    }
    .live-host-marker {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .live-host-marker .host-pulse-ring {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.35);
      animation: hostPulse 2s infinite ease-out;
      pointer-events: none;
    }
    @keyframes hostPulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .host-rotator {
      position: absolute;
      width: 32px;
      height: 32px;
      top: 0;
      left: 0;
      transform-origin: 16px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .host-arrow-wrap {
      position: absolute;
      top: -1px;
      left: 4px;
      width: 24px;
      height: 24px;
      pointer-events: none;
    }
    .host-arrow-svg {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
    }
    .host-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      position: absolute;
      top: 9px;
      left: 9px;
      background: #22c55e;
      z-index: 2;
    }
    .live-host-marker.offline .host-dot,
    .live-host-marker.disconnected .host-dot,
    .live-host-marker.ended .host-dot {
      background: #94a3b8 !important;
    }
    .live-host-marker.paused .host-dot {
      background: #f59e0b !important;
    }
    .live-host-marker.standby .host-dot {
      background: #3b82f6 !important;
    }

    .live-visitor-marker {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #0284c7;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .visitor-inner-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="top-card">
    <div class="header-row">
      <div class="header-left">
        <div id="sessionTitle" class="session-title">Live Location</div>
      </div>
      <div class="header-right">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div id="liveBadge" class="live-badge"><div class="pulse-dot"></div> ONLINE</div>
          <button id="cardToggleBtn" class="card-toggle-btn" onclick="toggleCard()" title="Collapse / Expand Info Card" aria-label="Toggle Info Card">
            <svg class="toggle-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
        </div>
        <span id="countdownChip" class="countdown-chip">Connecting...</span>
      </div>
    </div>
    
    <div id="statusAlert" class="status-alert"></div>
    <div id="activityBadge" class="activity-badge" style="display: none;"></div>
    <div id="placeName" class="place-name">Connecting...</div>
    <div id="trekkingBadge" class="trekking-badge" style="display: none;"></div>
    
    <div class="stats-row">
      <div class="stat-item">Speed: <b id="speedVal">--</b></div>
      <div class="stat-item">Alt: <b id="altVal">--</b></div>
      <div class="stat-item">Battery: <b id="batteryVal">--</b></div>
      <div class="stat-item" id="accuracyStat" style="display: none;">GPS: <b id="accuracyVal">--</b></div>
      <div class="stat-item" id="visitorDistanceStat" style="display: none;">To Host: <b id="visitorDistanceVal">--</b></div>
      <div class="stat-item">Last seen: <b id="updatedVal">Waiting...</b></div>
    </div>

    <div class="actions-row">
      <label id="pastTripsToggleLabel" style="display: none; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; cursor: pointer; user-select: none;">
        <input type="checkbox" id="pastTripsCheckbox" onchange="togglePastTrips(this.checked)" style="cursor: pointer; accent-color: #38bdf8;">
        <span>Show Past Trips</span>
      </label>
      <button class="gmaps-btn" id="gmapsBtn" onclick="openGoogleMaps()" title="Open current location in Google Maps">
        🗺️ Google Maps
      </button>
    </div>

    <div id="guestSharingRow" class="guest-sharing-row" style="display: none;">
      <span class="guest-sharing-label">📍 Sharing your location with host as:</span>
      <span class="guest-name-pill" id="guestNamePill" onclick="promptEditGuestName()" title="Click to edit nickname">
        <span id="guestNameDisplay">Guest</span> ✏️
      </span>
    </div>
  </div>


  <div id="map"></div>
  <div class="map-controls-group">
    <!-- Reset North -->
    <button class="map-ctrl-btn" id="compassBtn" onclick="resetNorth()" title="Reset Map North (0°)">
      <div class="compass-rose" id="compassRose">
        <div class="needle-north"></div>
        <div class="needle-south"></div>
        <div class="compass-pivot"></div>
      </div>
      <div class="compass-heading-text" id="compassHeadingText">N</div>
    </button>
    <!-- Follow Host -->
    <button class="map-ctrl-btn active" id="hostRecenterBtn" onclick="recenterMap()" title="Follow Host">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8"></circle>
        <line x1="12" y1="2" x2="12" y2="5"></line>
        <line x1="12" y1="19" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="5" y2="12"></line>
        <line x1="19" y1="12" x2="22" y2="12"></line>
        <circle cx="12" cy="12" r="2.5" fill="currentColor"></circle>
      </svg>
    </button>
    <!-- My Location (Visitor) -->
    <button class="map-ctrl-btn visitor" id="visitorRecenterBtn" onclick="recenterVisitor()" title="My Location (Visitor)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3 11 22 2 13 21 11 13 3 11" fill="currentColor" fill-opacity="0.2"></polygon>
      </svg>
    </button>
    <!-- Fit Route Bounds -->
    <button class="map-ctrl-btn" id="fitBoundsBtn" onclick="fitTripBounds()" title="Fit Entire Route">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <polyline points="21 15 21 21 15 21"></polyline>
        <polyline points="3 9 3 3 9 3"></polyline>
        <path d="M7 17l4-4 3 3 3-5" stroke-dasharray="1 1"></path>
      </svg>
    </button>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/');
    let sessionId = pathParts[pathParts.length - 1];
    if (!sessionId || sessionId === 'live') {
      const urlParams = new URLSearchParams(window.location.search);
      sessionId = urlParams.get('id') || 'demo';
    }

    const map = L.map('map', { 
      zoomControl: false,
      rotate: true,
      touchRotate: true,
      rotateControl: false
    }).setView([49.822, 19.044], 14);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let userMarker = null;
    let hostAccuracyCircle = null;
    let trackPolyline = L.polyline([], { color: '#EF4444', weight: 5, opacity: 0.9, lineJoin: 'round', lineCap: 'round' }).addTo(map);
    let pastSegmentsLayers = [];
    let showPastTrips = false;
    let pauseMarkers = [];
    let autoFollow = true;
    let lastCoords = null;
    let currentSessionMeta = null;
    let lastHostState = { isOnline: true, isPaused: false, statusClass: 'online', bearing: null, accuracy: null };

    function togglePastTrips(checked) {
      showPastTrips = checked;
      pastSegmentsLayers.forEach(l => {
        if (showPastTrips) {
          l.addTo(map);
        } else {
          map.removeLayer(l);
        }
      });
    }

    map.on('dragstart', () => { 
      autoFollow = false; 
      document.getElementById('hostRecenterBtn')?.classList.remove('active');
    });

    function updateCompassHeading(bearing) {
      const compassRose = document.getElementById('compassRose');
      const compassText = document.getElementById('compassHeadingText');
      if (compassRose && compassText) {
        const b = Math.round(((bearing % 360) + 360) % 360);
        const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
        const dir = dirs[Math.round(b / 45) % 8];
        compassRose.style.transform = `rotate(${-b}deg)`;
        compassText.textContent = `${b}° ${dir}`;
      }
    }

    function createHostIcon(isOnline, isPaused, statusClass, bearing) {
      const mapBearing = (map.getBearing ? map.getBearing() : 0) || 0;
      const b = (bearing !== null && bearing !== undefined) ? (bearing - mapBearing) : 0;
      const dotColor = isOnline ? '#22c55e' : (isPaused ? '#f59e0b' : '#94a3b8');

      const html = `
        <div class="live-host-marker ${statusClass || (isOnline ? 'online' : 'offline')}">
          ${isOnline ? '<div class="host-pulse-ring"></div>' : ''}
          <div class="host-rotator" style="transform: rotate(${b}deg);">
            ${isOnline ? `
              <div class="host-arrow-wrap">
                <svg viewBox="0 0 24 24" width="24" height="24" class="host-arrow-svg">
                  <polygon points="12,1 18,10 6,10" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
              </div>` : ''}
            <div class="host-dot" style="background-color: ${dotColor};"></div>
          </div>
        </div>
      `;

      return L.divIcon({
        className: 'live-host-icon-container',
        html: html,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
    }

    let markerAnimFrame = null;
    let currentMarkerCoords = null;

    function animateMarkerTo(targetCoords, targetAccuracy, durationMs = 1500) {
      if (!userMarker) return;
      if (!currentMarkerCoords) {
        currentMarkerCoords = [targetCoords[0], targetCoords[1]];
        userMarker.setLatLng(targetCoords);
        if (hostAccuracyCircle) hostAccuracyCircle.setLatLng(targetCoords);
        return;
      }

      const startLat = currentMarkerCoords[0];
      const startLng = currentMarkerCoords[1];
      const endLat = targetCoords[0];
      const endLng = targetCoords[1];

      const dLat = endLat - startLat;
      const dLng = endLng - startLng;

      // If micro-jitter (< 1e-6) or massive jump (> 0.2 degrees ~ 20km), snap directly
      if (Math.abs(dLat) < 0.000001 && Math.abs(dLng) < 0.000001) {
        return;
      }
      if (Math.abs(dLat) > 0.2 || Math.abs(dLng) > 0.2) {
        currentMarkerCoords = [endLat, endLng];
        userMarker.setLatLng(targetCoords);
        if (hostAccuracyCircle) hostAccuracyCircle.setLatLng(targetCoords);
        return;
      }

      if (markerAnimFrame) {
        cancelAnimationFrame(markerAnimFrame);
        markerAnimFrame = null;
      }

      const startTime = performance.now();
      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1.0, elapsed / durationMs);
        // Cubic ease-out
        const ease = 1 - Math.pow(1 - progress, 3);
        const curLat = startLat + dLat * ease;
        const curLng = startLng + dLng * ease;
        currentMarkerCoords = [curLat, curLng];
        if (userMarker) userMarker.setLatLng([curLat, curLng]);
        if (hostAccuracyCircle) hostAccuracyCircle.setLatLng([curLat, curLng]);

        if (progress < 1.0) {
          markerAnimFrame = requestAnimationFrame(step);
        } else {
          markerAnimFrame = null;
          currentMarkerCoords = [endLat, endLng];
        }
      }
      markerAnimFrame = requestAnimationFrame(step);
    }

    function updateHostMarker(coords, isOnline, isPaused, statusClass, bearing, accuracy, animate = false, animDurationMs = 1500) {
      if (!coords) return;
      lastHostState = { isOnline, isPaused, statusClass, bearing, accuracy };
      const icon = createHostIcon(isOnline, isPaused, statusClass, bearing);
      if (!userMarker) {
        currentMarkerCoords = [coords[0], coords[1]];
        userMarker = L.marker(coords, { icon, zIndexOffset: 1000 }).addTo(map);
        recenterMap(15);
      } else {
        userMarker.setIcon(icon);
        if (animate) {
          animateMarkerTo(coords, accuracy, animDurationMs);
        } else {
          if (markerAnimFrame) {
            cancelAnimationFrame(markerAnimFrame);
            markerAnimFrame = null;
          }
          currentMarkerCoords = [coords[0], coords[1]];
          userMarker.setLatLng(coords);
        }
      }

      if (accuracy !== null && accuracy !== undefined && accuracy > 0) {
        if (!hostAccuracyCircle) {
          hostAccuracyCircle = L.circle(coords, {
            radius: accuracy,
            color: '#3B82F6',
            fillColor: '#3B82F6',
            fillOpacity: 0.12,
            weight: 1,
            interactive: false
          }).addTo(map);
        } else {
          if (!animate) {
            hostAccuracyCircle.setLatLng(coords);
          }
          hostAccuracyCircle.setRadius(accuracy);
        }
      } else if (hostAccuracyCircle) {
        map.removeLayer(hostAccuracyCircle);
        hostAccuracyCircle = null;
      }
    }

    map.on('rotate', () => {
      const b = (map.getBearing ? map.getBearing() : 0) || 0;
      updateCompassHeading(b);
      if (userMarker && lastCoords) {
        updateHostMarker(lastCoords, lastHostState.isOnline, lastHostState.isPaused, lastHostState.statusClass, lastHostState.bearing, lastHostState.accuracy);
      }
    });

    function resetNorth() {
      if (map.setBearing) {
        map.setBearing(0);
      }
      updateCompassHeading(0);
      if (userMarker && lastCoords) {
        updateHostMarker(lastCoords, lastHostState.isOnline, lastHostState.isPaused, lastHostState.statusClass, lastHostState.bearing, lastHostState.accuracy);
      }
    }

    function toggleCard() {
      const card = document.querySelector('.top-card');
      const btn = document.getElementById('cardToggleBtn');
      if (!card) return;
      const isCollapsed = card.classList.toggle('collapsed');
      if (btn) btn.textContent = isCollapsed ? '▼' : '▲';
      try {
        localStorage.setItem('whereami_top_card_collapsed', isCollapsed ? '1' : '0');
      } catch (_) {}
    }

    try {
      if (localStorage.getItem('whereami_top_card_collapsed') === '1') {
        const card = document.querySelector('.top-card');
        const btn = document.getElementById('cardToggleBtn');
        if (card) card.classList.add('collapsed');
        if (btn) btn.textContent = '▼';
      }
    } catch (_) {}

    function renderPauses(pauses) {
      pauseMarkers.forEach(m => map.removeLayer(m));
      pauseMarkers = [];

      if (!Array.isArray(pauses) || pauses.length === 0) return;

      pauses.forEach(p => {
        if (!p.lat || !p.lng) return;
        const durMs = p.durationMs || (p.endTime && p.startTime ? p.endTime - p.startTime : 0);
        if (durMs < 30000) return;

        let durText = '';
        if (durMs < 60000) {
          durText = Math.round(durMs / 1000) + 's';
        } else if (durMs < 3600000) {
          durText = Math.floor(durMs / 60000) + 'm';
        } else {
          const h = Math.floor(durMs / 3600000);
          const m = Math.floor((durMs % 3600000) / 60000);
          durText = `${h}h ${m}m`;
        }

        const icon = L.divIcon({
          className: 'pause-marker-pill',
          html: `<div style="background:#f59e0b;color:#fff;border:2px solid #fff;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.4);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;">⏸️ ${durText}</div>`,
          iconAnchor: [24, 12]
        });

        const marker = L.marker([p.lat, p.lng], { icon, zIndexOffset: 500 }).addTo(map);
        pauseMarkers.push(marker);
      });
    }

    let visitorCoords = null;
    let visitorMarker = null;
    let visitorAccuracyCircle = null;

    function getOffsetCenter(coords, zoom) {
      const topCard = document.querySelector('.top-card');
      const cardHeight = topCard ? topCard.offsetHeight : 160;
      const point = map.project(coords, zoom);
      const targetPoint = point.subtract([0, cardHeight / 2]);
      return map.unproject(targetPoint, zoom);
    }

    function updateVisitorDistance() {
      const distEl = document.getElementById('visitorDistanceStat');
      const distVal = document.getElementById('visitorDistanceVal');
      if (!distEl || !distVal) return;
      if (lastCoords && visitorCoords) {
        const dMeters = map.distance(lastCoords, visitorCoords);
        distVal.textContent = dMeters < 1000 ? `${Math.round(dMeters)} m` : `${(dMeters / 1000).toFixed(2)} km`;
        distEl.style.display = 'inline-block';
      } else {
        distEl.style.display = 'none';
      }
    }

    function recenterMap(zoom) {
      if (lastCoords) {
        if (map.setBearing) map.setBearing(0);
        const targetZoom = zoom || (map.getZoom() < 15 ? 15 : map.getZoom());
        const offsetCenter = getOffsetCenter(lastCoords, targetZoom);
        map.setView(offsetCenter, targetZoom);
        autoFollow = true;
        document.getElementById('hostRecenterBtn')?.classList.add('active');
        document.getElementById('visitorRecenterBtn')?.classList.remove('active');
      }
    }

    function recenterVisitor(zoom) {
      if (visitorCoords) {
        if (map.setBearing) map.setBearing(0);
        const targetZoom = zoom || (map.getZoom() < 15 ? 15 : map.getZoom());
        const offsetCenter = getOffsetCenter(visitorCoords, targetZoom);
        map.setView(offsetCenter, targetZoom);
        autoFollow = false;
        document.getElementById('hostRecenterBtn')?.classList.remove('active');
        document.getElementById('visitorRecenterBtn')?.classList.add('active');
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            onVisitorPosition(pos);
            if (visitorCoords) {
              const targetZoom = zoom || (map.getZoom() < 15 ? 15 : map.getZoom());
              map.setView(getOffsetCenter(visitorCoords, targetZoom), targetZoom);
              autoFollow = false;
              document.getElementById('hostRecenterBtn')?.classList.remove('active');
              document.getElementById('visitorRecenterBtn')?.classList.add('active');
            }
          },
          err => console.warn('Visitor location unavailable:', err),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 10000 }
        );
      }
    }

    function fitTripBounds() {
      const points = [];
      const latlngs = trackPolyline.getLatLngs();
      if (latlngs && latlngs.length > 0) {
        points.push(...latlngs);
      } else if (lastCoords) {
        points.push(L.latLng(lastCoords[0], lastCoords[1]));
      }

      if (visitorCoords) {
        points.push(L.latLng(visitorCoords[0], visitorCoords[1]));
      }

      if (points.length > 1) {
        const bounds = L.latLngBounds(points);
        const topCard = document.querySelector('.top-card');
        const topOffset = topCard ? (topCard.offsetHeight + 24) : 180;
        map.fitBounds(bounds, {
          paddingTopLeft: [30, topOffset],
          paddingBottomRight: [30, 90],
          maxZoom: 16
        });
        autoFollow = false;
        document.getElementById('hostRecenterBtn')?.classList.remove('active');
        document.getElementById('visitorRecenterBtn')?.classList.remove('active');
      } else if (lastCoords) {
        recenterMap(15);
      } else if (visitorCoords) {
        recenterVisitor(15);
      }
    }

    function onVisitorPosition(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;
      visitorCoords = [lat, lng];

      if (!visitorMarker) {
        const icon = L.divIcon({
          className: 'live-visitor-icon-container',
          html: '<div class="live-visitor-marker"><div class="visitor-inner-dot"></div></div>',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });
        visitorMarker = L.marker([lat, lng], { icon, zIndexOffset: 900 })
          .bindTooltip('👤 You (Visitor)', { permanent: false, direction: 'top' })
          .addTo(map);
      } else {
        visitorMarker.setLatLng([lat, lng]);
      }

      if (acc && acc < 1000) {
        if (!visitorAccuracyCircle) {
          visitorAccuracyCircle = L.circle([lat, lng], {
            radius: acc,
            color: '#10b981',
            weight: 1,
            fillColor: '#10b981',
            fillOpacity: 0.12
          }).addTo(map);
        } else {
          visitorAccuracyCircle.setLatLng([lat, lng]);
          visitorAccuracyCircle.setRadius(acc);
        }
      }

      updateVisitorDistance();
      streamGuestLocation(lat, lng, acc);
    }

    function getOrCreateGuestId() {
      let id = localStorage.getItem('whereami_guest_device_id');
      if (!id) {
        id = 'g_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
        localStorage.setItem('whereami_guest_device_id', id);
      }
      return id;
    }

    function getGuestNickname() {
      return localStorage.getItem('whereami_guest_nickname') || '';
    }

    function setGuestNickname(name) {
      if (name && name.trim()) {
        localStorage.setItem('whereami_guest_nickname', name.trim().slice(0, 30));
      } else {
        localStorage.removeItem('whereami_guest_nickname');
      }
    }

    function promptEditGuestName() {
      const current = getGuestNickname() || (document.getElementById('guestNameDisplay')?.textContent || '');
      const newName = prompt('Enter your name to share with the host (leave blank to restore default):', current === 'Guest' ? '' : current);
      if (newName !== null) {
        setGuestNickname(newName);
        const display = document.getElementById('guestNameDisplay');
        if (display) display.textContent = newName.trim() || 'Guest';
        if (visitorCoords) {
          streamGuestLocation(visitorCoords[0], visitorCoords[1], null, true);
        }
      }
    }

    let lastGuestPushTime = 0;
    let lastGuestPushCoords = null;
    let lastGuestAssignedName = null;

    function streamGuestLocation(lat, lng, acc, force = false) {
      if (window.currentSessionFollowGuests === false) {
        const row = document.getElementById('guestSharingRow');
        if (row) row.style.display = 'none';
        return;
      }

      const now = Date.now();
      if (!force && lastGuestPushCoords) {
        const d = map.distance(lastGuestPushCoords, [lat, lng]);
        if (d < 10 && (now - lastGuestPushTime < 8000)) return;
      }
      lastGuestPushTime = now;
      lastGuestPushCoords = [lat, lng];

      const gId = getOrCreateGuestId();
      const nick = getGuestNickname();

      fetch('/api/sessions/' + sessionId + '/guests/' + gId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lat: lat,
          lng: lng,
          acc: acc || null,
          name: nick || undefined
        })
      }).then(res => res.json()).then(data => {
        if (data && data.success && data.guest) {
          lastGuestAssignedName = data.guest.name;
          const row = document.getElementById('guestSharingRow');
          const display = document.getElementById('guestNameDisplay');
          if (row) row.style.display = 'flex';
          if (display) display.textContent = data.guest.name;
        }
      }).catch(err => console.debug('Guest stream err:', err));
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        onVisitorPosition,
        err => console.warn('Visitor watchPosition error:', err),
        { enableHighAccuracy: true, maximumAge: 5000 }
      );
    }

    function openGoogleMaps() {
      if (lastCoords && lastCoords.length === 2) {
        const url = `https://www.google.com/maps/search/?api=1&query=${lastCoords[0]},${lastCoords[1]}`;
        window.open(url, '_blank');
      }
    }

    function formatTimeDisplay(expiresAt, createdAt) {
      if (!expiresAt || expiresAt <= 0) {
        if (!createdAt) return "Continuous";
        const elapsedMs = Math.max(0, Date.now() - createdAt);
        const hrs = Math.floor(elapsedMs / (1000 * 3600));
        const mins = Math.floor((elapsedMs % (1000 * 3600)) / (1000 * 60));
        return hrs > 0 ? `⏱️ ${hrs}h ${mins}m elapsed` : `⏱️ ${mins}m elapsed`;
      }
      const diff = expiresAt - Date.now();
      if (diff <= 0) return "Expired";
      const hrs = Math.floor(diff / (1000 * 3600));
      const mins = Math.floor((diff % (1000 * 3600)) / (1000 * 60));
      return hrs > 0 ? `⏳ ${hrs}h ${mins}m left` : `⏳ ${mins}m left`;
    }

    function updateTimerTicker() {
      if (!currentSessionMeta) return;
      const chip = document.getElementById('countdownChip');
      if (chip && currentSessionMeta.createdAt) {
        chip.textContent = formatTimeDisplay(currentSessionMeta.expiresAt, currentSessionMeta.createdAt);
        if (chip.style.display === 'none') {
          chip.style.display = 'inline-block';
        }
      }
    }
    let isInitialPageView = false;
    try {
      const pvKey = 'whereami_pv_' + sessionId;
      if (!sessionStorage.getItem(pvKey)) {
        sessionStorage.setItem(pvKey, '1');
        isInitialPageView = true;
      }
    } catch (_) {
      isInitialPageView = true;
    }

    async function fetchTrack() {
      try {
        const guestIdParam = encodeURIComponent(getOrCreateGuestId());
        let fetchUrl = '/api/sessions/' + sessionId + '?guestId=' + guestIdParam;
        if (isInitialPageView) {
          fetchUrl += '&pv=1';
          isInitialPageView = false;
        }
        const res = await fetch(fetchUrl, { cache: 'no-store' });
        if (!res.ok) {
          if (res.status === 404) {
            document.getElementById('placeName').textContent = 'Session not found';
            document.getElementById('liveBadge').textContent = 'OFFLINE';
            document.getElementById('liveBadge').style.background = 'rgba(100, 116, 139, 0.2)';
            document.getElementById('liveBadge').style.color = '#94a3b8';
            document.getElementById('countdownChip').style.display = 'none';
          }
          return;
        }
        const data = await res.json();
        
        window.currentSessionFollowGuests = data.followGuests !== false;
        if (window.currentSessionFollowGuests === false) {
          const row = document.getElementById('guestSharingRow');
          if (row) row.style.display = 'none';
        } else if (lastGuestAssignedName) {
          const row = document.getElementById('guestSharingRow');
          if (row) row.style.display = 'flex';
        }

        currentSessionMeta = { expiresAt: data.expiresAt, createdAt: data.createdAt };
        document.getElementById('sessionTitle').textContent = data.title || 'Live Location';
        const countdownChip = document.getElementById('countdownChip');
        countdownChip.style.display = 'inline-block';
        countdownChip.textContent = formatTimeDisplay(data.expiresAt, data.createdAt);

        const alertBox = document.getElementById('statusAlert');
        const badge = document.getElementById('liveBadge');

        const isChargingBoost = Boolean(data.current?.isCharging);
        const syncIntervalMs = data.current?.syncIntervalMs || 0;

        const agoSec = data.current?.t ? Math.max(0, Math.round((Date.now() - data.current.t) / 1000)) : 0;
        const lastSeenStr = agoSec < 60 ? (agoSec + 's ago') : (Math.round(agoSec / 60) + 'm ago');
        const lastTimeStr = data.current?.t ? new Date(data.current.t).toLocaleTimeString() : '';

        const syncIntervalSec = ((data.syncIntervalMinutes || 5) * 60);
        const disconnectThresholdSec = Math.max(180, (syncIntervalSec * 2) + 30);

        const isSessionEnded = Boolean(data.ended) || (data.expiresAt > 0 && Date.now() > data.expiresAt);
        const isSessionPaused = Boolean(data.paused);
        const isSessionActive = !isSessionEnded && (data.active !== false);

        const isDisconnected = (agoSec >= disconnectThresholdSec);
        let isOnline = false;
        let statusClass = 'offline';

        if (!isSessionActive) {
          if (data.isStatic) {
            statusClass = 'stopped';
            badge.textContent = 'STOPPED';
            badge.style.background = 'rgba(239, 68, 68, 0.2)';
            badge.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            badge.style.color = '#ef4444';
            alertBox.className = 'status-alert alert-ended';
            alertBox.textContent = '⏹️ Live Sharing Stopped. Host has stopped broadcasting.';
            alertBox.style.display = 'block';
            if (!data.current) {
              document.getElementById('placeName').textContent = 'Live broadcast stopped.';
              document.getElementById('countdownChip').style.display = 'none';
            }
          } else {
            statusClass = 'ended';
            badge.textContent = 'STOPPED';
            badge.style.background = 'rgba(239, 68, 68, 0.2)';
            badge.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            badge.style.color = '#ef4444';
            alertBox.className = 'status-alert alert-ended';
            alertBox.textContent = '⏹️ Live Sharing Stopped. The host has completed this trip.';
            alertBox.style.display = 'block';
          }
        } else if (isSessionPaused) {
          statusClass = 'paused';
          badge.textContent = 'PAUSED';
          badge.style.background = 'rgba(245, 158, 11, 0.2)';
          badge.style.borderColor = 'rgba(251, 191, 36, 0.4)';
          badge.style.color = '#fbbf24';
          alertBox.className = 'status-alert alert-paused';
          alertBox.textContent = lastTimeStr ? `⏸️ Live Sharing is currently paused by host (last active ${lastSeenStr} at ${lastTimeStr}).` : '⏸️ Live Sharing is currently paused by the host.';
          alertBox.style.display = 'block';
        } else if (isDisconnected) {
          statusClass = 'disconnected';
          badge.textContent = 'DISCONNECTED';
          badge.style.background = 'rgba(245, 158, 11, 0.2)';
          badge.style.borderColor = 'rgba(251, 191, 36, 0.4)';
          badge.style.color = '#fbbf24';
          alertBox.className = 'status-alert alert-paused';
          alertBox.textContent = `⚠️ Host disconnected (no update for ${lastSeenStr}, last seen at ${lastTimeStr}). Showing last known position.`;
          alertBox.style.display = 'block';
        } else {
          isOnline = true;
          statusClass = 'online';
          badge.innerHTML = isChargingBoost 
            ? '<div class="pulse-dot" style="background:#60a5fa;box-shadow:0 0 8px #60a5fa;"></div> ⚡ LIVE (boost)' 
            : `<div class="pulse-dot"></div> ONLINE (${data.syncIntervalMinutes || 1}m)`;
          badge.style.background = isChargingBoost 
            ? 'rgba(59, 130, 246, 0.22)' 
            : 'rgba(34, 197, 94, 0.18)';
          badge.style.borderColor = isChargingBoost 
            ? 'rgba(96, 165, 250, 0.55)' 
            : 'rgba(74, 222, 128, 0.45)';
          badge.style.color = isChargingBoost 
            ? '#60a5fa' 
            : '#4ade80';
          alertBox.className = 'status-alert';
          alertBox.style.display = 'none';
        }

        if (data.current) {
          const { lat, lng, spd, alt, place, trekking, battery, t, acc, isCharging, syncIntervalMs } = data.current;
          lastCoords = [lat, lng];
          updateVisitorDistance();

          document.getElementById('placeName').textContent = place || (isSessionActive ? 'Active Track' : 'Stopped');
          document.getElementById('speedVal').textContent = isSessionActive ? (spd ? (spd.toFixed(1) + ' km/h') : '0.0 km/h') : '--';
          document.getElementById('altVal').textContent = isSessionActive ? (alt ? (Math.round(alt) + ' m ASL') : '--') : '--';
          document.getElementById('batteryVal').textContent = isSessionActive ? (battery >= 0 ? ((isCharging ? '⚡ ' : '🔋') + battery + '%') : '--') : '--';
          
          const accEl = document.getElementById('accuracyStat');
          const accVal = document.getElementById('accuracyVal');
          if (accEl && accVal) {
            if (isSessionActive && acc !== null && acc !== undefined && acc > 0) {
              accVal.textContent = `±${Math.round(acc)} m`;
              accEl.style.display = 'inline-block';
            } else {
              accEl.style.display = 'none';
            }
          }

          const agoSec = Math.max(0, Math.round((Date.now() - t) / 1000));
          const cadenceText = isChargingBoost ? (spd && spd > 1.0 ? '⚡ ~5s' : '⚡ ~15s') : `${data.syncIntervalMinutes || 1}m`;
          document.getElementById('updatedVal').textContent = (agoSec < 60 ? (agoSec + 's ago') : (Math.round(agoSec/60) + 'm ago')) + ` (${cadenceText})`;

          if (trekking) {
            document.getElementById('trekkingBadge').style.display = 'block';
            document.getElementById('trekkingBadge').textContent = trekking;
          } else {
            document.getElementById('trekkingBadge').style.display = 'none';
          }

          const activityEl = document.getElementById('activityBadge');
          if (activityEl) {
            const profile = data.current.activityProfile;
            const profileIcon = data.current.activityProfileIcon;
            const profileName = data.current.activityProfileName;
            if (profile && isSessionActive) {
              const icon = profileIcon || (profile === 'CAR' ? '🚗' : profile === 'CYCLING' ? '🚴' : profile === 'MTB' ? '🚵' : profile === 'HIKING' ? '🥾' : profile === 'WALKING' ? '🚶' : profile === 'RUNNING' ? '🏃' : '📍');
              const label = profileName || (profile.charAt(0) + profile.slice(1).toLowerCase());
              activityEl.innerHTML = `${icon} <span>${label}</span>`;
              activityEl.style.display = 'inline-flex';
            } else {
              activityEl.style.display = 'none';
            }
          }


          // MAP-R04: Compass Rose Heading Update
          const bearing = data.current.bearing;
          const compassRose = document.getElementById('compassRose');
          const compassText = document.getElementById('compassHeadingText');
          if (compassRose && compassText) {
            if (bearing !== null && bearing !== undefined) {
              const b = Math.round(bearing);
              const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
              const dir = dirs[Math.round(b / 45) % 8];
              compassRose.style.transform = `rotate(${b}deg)`;
              compassText.textContent = `${b}° ${dir}`;
            } else {
              compassRose.style.transform = 'rotate(0deg)';
              compassText.textContent = 'N';
            }
          }

          const isHighFrequency = Boolean(isCharging || (syncIntervalMs && syncIntervalMs <= 10000));
          const animDuration = isHighFrequency ? Math.min(2500, Math.max(1000, (syncIntervalMs || 2000) * 0.9)) : 1500;
          updateHostMarker([lat, lng], isOnline, isSessionPaused, statusClass, bearing, acc, true, animDuration);
          if (autoFollow) {
            const currentZoom = map.getZoom() || 15;
            const offsetCenter = getOffsetCenter([lat, lng], currentZoom);
            map.panTo(offsetCenter);
          }
        }

        const isTrailVisible = data.trailVisible !== false;
        if (isTrailVisible && Array.isArray(data.points) && data.points.length > 0) {
          const latlngs = data.points.map(p => [p.lat, p.lng]);
          trackPolyline.setLatLngs(latlngs);
        } else {
          trackPolyline.setLatLngs([]);
        }

        // Render past segments if any
        const hasPast = Array.isArray(data.pastSegments) && data.pastSegments.length > 0;
        const pastToggleLabel = document.getElementById('pastTripsToggleLabel');
        if (pastToggleLabel) {
          pastToggleLabel.style.display = hasPast ? 'inline-flex' : 'none';
        }
        if (hasPast) {
          // Recreate past polylines if segment count changed
          if (pastSegmentsLayers.length !== data.pastSegments.length) {
            pastSegmentsLayers.forEach(l => map.removeLayer(l));
            pastSegmentsLayers = [];
            data.pastSegments.forEach(seg => {
              const segLatLngs = seg.map(p => [p.lat, p.lng]);
              const poly = L.polyline(segLatLngs, {
                color: '#64748b',
                weight: 3.5,
                opacity: 0.55,
                dashArray: '6, 8',
                lineJoin: 'round',
                lineCap: 'round'
              });
              if (showPastTrips) poly.addTo(map);
              pastSegmentsLayers.push(poly);
            });
          }
        } else {
          pastSegmentsLayers.forEach(l => map.removeLayer(l));
          pastSegmentsLayers = [];
        }

        renderPauses(data.pauses);

        // Adaptive polling schedule
        const isHostActive = isSessionActive && !isSessionPaused && !isDisconnected;
        if (isHostActive && (isChargingBoost || (syncIntervalMs > 0 && syncIntervalMs <= 10000))) {
          nextPollIntervalMs = 2500; // Snappy 2.5s polling during charging boost
        } else if (isHostActive) {
          nextPollIntervalMs = 4000;
        } else {
          nextPollIntervalMs = 5000;
        }
      } catch (err) {
        console.error('Fetch error:', err);
        nextPollIntervalMs = 5000;
      }
    }

    let pollTimeoutId = null;
    let nextPollIntervalMs = 4000;

    async function pollLoop() {
      await fetchTrack();
      if (pollTimeoutId) clearTimeout(pollTimeoutId);
      pollTimeoutId = setTimeout(pollLoop, nextPollIntervalMs);
    }

    pollLoop();
  </script>
